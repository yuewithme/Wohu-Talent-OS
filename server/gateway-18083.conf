server {
    listen 18083;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve the service address after its container is recreated.
    resolver 127.0.0.11 valid=10s;
    set $resume_service http://resume-sync:8787;

    location = /healthz {
        proxy_pass $resume_service$request_uri;
    }

    location /v1/ {
        client_max_body_size 30m;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        proxy_pass $resume_service$request_uri;
    }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
