services:
  gateway:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    env_file: server/.env
    ports:
      - "443:443"
    volumes:
      - ./server/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [resume-sync]
    security_opt: [no-new-privileges:true]
volumes:
  caddy-data:
  caddy-config:
